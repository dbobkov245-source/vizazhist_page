<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Gallery Demo</title>
    <style>
        body {
            background-color: #fcf4eb;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .gallery-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 600px;
            display: flex;
            align-items: center;
            /* To push the hero to the right side of the view */
            justify-content: flex-end; 
            padding-right: 100px;
            perspective: 1000px; /* Essential for 3D */
        }

        .gallery-track {
            position: relative;
            display: flex;
            /* We need them to overlap, behaving like a deck of cards spread out */
            width: auto;
            transform-style: preserve-3d;
        }

        .card {
            position: relative;
            width: 300px;
            aspect-ratio: 3/4;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.5s ease-out;
            /* Default state for safety */
            transform-origin: left center; 
            
            /* Absolute positioning helps with precise overlap, 
               but Flex row-reverse might be easier for stacking order.
               Let's try absolute stacking for total control or flex with negative margins.
            */
            margin-right: -200px; /* Overlap */
            
            /* Setup for the "Hero at the end" (visual right) 
               which matches DOM order if we use flex-direction: row.
               But we want the rightmost to be on TOP.
               In normal flow, later elements are on top of earlier ones.
               So: Card 1 (Left), Card 2, ... Card N (Right, Hero).
               This works for z-index naturally!
            */
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 
           THE LOGIC:
           Last child is the Hero (Rightmost).
           As we go backwards (nth-last-child), we apply transforms.
        */

        /* HERO: No transform, fully visible */
        .card:last-child {
            z-index: 10;
            transform: scale(1.1) translateX(0) rotateY(0);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            margin-right: 0;
        }

        /* 1st behind (Left of hero) */
        .card:nth-last-child(2) {
            z-index: 9;
            transform: scale(0.95) translateX(-50px) rotateY(15deg);
            opacity: 0.9;
        }

        /* 2nd behind */
        .card:nth-last-child(3) {
            z-index: 8;
            transform: scale(0.9) translateX(-100px) rotateY(15deg);
            opacity: 0.8;
        }

        /* 3rd behind */
        .card:nth-last-child(4) {
            z-index: 7;
            transform: scale(0.85) translateX(-150px) rotateY(15deg);
            opacity: 0.7;
        }

        /* 4th behind */
        .card:nth-last-child(5) {
            z-index: 6;
            transform: scale(0.8) translateX(-200px) rotateY(15deg);
            opacity: 0.6;
        }

        /* 5th behind */
        .card:nth-last-child(6) {
            z-index: 5;
            transform: scale(0.75) translateX(-250px) rotateY(15deg);
            opacity: 0.5;
        }

        /* Further items fade out or hide */
        .card:nth-last-child(n+7) {
            z-index: 1;
            transform: scale(0.7) translateX(-300px) rotateY(15deg);
            opacity: 0;
        }

    </style>
</head>
<body>

    <div class="gallery-container">
        <div class="gallery-track">
            <!-- Images from 1/ folder -->
            <!-- Order: Leftmost -> Rightmost (Hero) -->
            <!-- So we want the Hero to be the LAST element -->
            
            <!-- Background items -->
            <div class="card"><img src="1/9.jpg" alt=""></div>
            <div class="card"><img src="1/8.jpg" alt=""></div>
            <div class="card"><img src="1/7.jpg" alt=""></div>
            <div class="card"><img src="1/6.jpg" alt=""></div>
            <div class="card"><img src="1/4.jpg" alt=""></div>
            
            <!-- Hero (Rightmost, Front) -->
            <div class="card"><img src="1/1.jpg" alt=""></div>
        </div>
    </div>

</body>
</html>
